# Local stack: Postgres, the API and the web client.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# The API migrates on boot, so the first start also creates the schema.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cleat
      POSTGRES_PASSWORD: cleat
      POSTGRES_DB: cleat
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cleat']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://cleat:cleat@postgres:5432/cleat
      JWT_SECRET: local-development-secret-change-me-please-32
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
      # Leave unset to run the deterministic local coach — the app is fully
      # usable without an API key.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Compose publishes the two services on different host ports, so here
        # the API genuinely is cross-origin and the URL has to be set.
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_DEFAULT_TENANT: public
    # The same value again, and it is not a duplicate. The build arg is inlined
    # into the client bundle; this one is read by the running server to build
    # the Content-Security-Policy. Set one without the other and the browser
    # refuses every API call while the container looks perfectly healthy.
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
