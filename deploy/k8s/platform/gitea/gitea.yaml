# Gitea — self-hosted git, CI and container registry.
#
# One service covers what GitHub was providing: repository hosting, pull
# requests, Actions, and an OCI registry. Running all three in one process is a
# deliberate trade for a small team — fewer moving parts to operate, at the
# cost of a single blast radius. The database is the same CloudNativePG
# cluster pattern used for the app, so there is one backup story rather than
# two.
#
# The registry matters more than it looks: without it, a self-hosted cluster
# still pulls its own application images from somebody else's infrastructure,
# and "self-hosted" stops being true at the moment it counts.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-db
  namespace: cleat-platform
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.8
  bootstrap:
    initdb:
      database: gitea
      owner: gitea
      secret:
        name: gitea-db-user
      encoding: UTF8
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://cleat-backups/gitea
      endpointURL: http://minio.cleat-platform.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: minio-credentials
          key: root-user
        secretAccessKey:
          name: minio-credentials
          key: root-password
      wal:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gitea-db-nightly
  namespace: cleat-platform
spec:
  schedule: '0 0 3 * * *'
  backupOwnerReference: self
  cluster:
    name: gitea-db
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: cleat-platform
  labels:
    app.kubernetes.io/name: gitea
spec:
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: ssh
      port: 22
      targetPort: ssh
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: cleat-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-config
  namespace: cleat-platform
data:
  # Gitea reads most of this from the environment via GITEA__section__KEY, but
  # the values worth explaining live here.
  GITEA__server__ROOT_URL: https://git.cleat.app/
  GITEA__server__SSH_DOMAIN: git.cleat.app
  GITEA__server__DOMAIN: git.cleat.app
  GITEA__server__HTTP_PORT: '3000'
  GITEA__server__SSH_PORT: '22'
  # This is a private forge for one product. Public sign-up would make it an
  # invitation to host other people's code on infrastructure holding recovery
  # data.
  GITEA__service__DISABLE_REGISTRATION: 'true'
  GITEA__service__REQUIRE_SIGNIN_VIEW: 'true'
  GITEA__security__INSTALL_LOCK: 'true'
  GITEA__actions__ENABLED: 'true'
  GITEA__packages__ENABLED: 'true'
  GITEA__repository__DEFAULT_BRANCH: main
  GITEA__database__DB_TYPE: postgres
  GITEA__database__HOST: gitea-db-rw:5432
  GITEA__database__NAME: gitea
  GITEA__database__SSL_MODE: require
  GITEA__log__LEVEL: Info
  # Gitea's built-in cron does housekeeping; leaving it off means stale
  # repositories and orphaned LFS objects accumulate quietly.
  GITEA__cron__ENABLED: 'true'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: cleat-platform
  labels:
    app.kubernetes.io/name: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gitea
          image: docker.gitea.com/gitea:1.23.7-rootless
          envFrom:
            - configMapRef:
                name: gitea-config
          env:
            - name: GITEA__database__USER
              valueFrom:
                secretKeyRef:
                  name: gitea-db-user
                  key: username
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-db-user
                  key: password
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: secret-key
            - name: GITEA__oauth2__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: jwt-secret
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            # Gitea runs migrations on first start; a tight startup probe kills
            # it mid-migration and leaves the schema half applied.
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
        - name: tmp
          emptyDir: {}
---
# The Actions runner. Separate deployment so CI load cannot starve the forge
# itself, and so it can be scaled or stopped without touching git hosting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: cleat-platform
  labels:
    app.kubernetes.io/name: gitea-runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: docker.gitea.com/act_runner:0.2.11
          env:
            - name: GITEA_INSTANCE_URL
              value: http://gitea:3000
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-token
                  key: token
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: '1'
          volumeMounts:
            - name: certs
              mountPath: /certs
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
        # Docker-in-docker as a sidecar rather than mounting the node's socket.
        # Mounting the host socket would give any CI job root on the node that
        # also runs the database — a compromised dependency in a test would own
        # the recovery data.
        - name: dind
          image: docker.io/library/docker:27.5-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          volumeMounts:
            - name: certs
              mountPath: /certs
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: certs
          emptyDir: {}
        - name: data
          emptyDir: {}
