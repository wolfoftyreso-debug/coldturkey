# MinIO — the object store backups are written to.
#
# It exists because a self-hosted deployment still needs somewhere to put
# base backups and WAL that is not the same disk as the database. A backup on
# the volume it is backing up is not a backup; it is a copy that dies with its
# original.
#
# For a single-node install this is enough. If the cluster spans machines,
# point CloudNativePG at storage that is genuinely somewhere else — another
# host, another rack, another building — because the failure this guards
# against is the one that takes the node with it.
apiVersion: v1
kind: Namespace
metadata:
  name: cleat-platform
  labels:
    app.kubernetes.io/part-of: cleat
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: cleat-platform
  labels:
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: cleat-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: cleat-platform
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  strategy:
    # Never two writers on one RWO volume. A rolling update would try exactly
    # that and wedge on the mount.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ['server', '/data', '--console-address', ':9001']
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
            # The console is for a human on a port-forward, not for the world.
            - name: MINIO_BROWSER_REDIRECT_URL
              value: http://localhost:9001
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
# Creates the bucket the operator writes to, and sets a lifecycle rule so old
# backups age out instead of filling the disk silently.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: cleat-platform
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          env:
            - name: ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mc alias set local http://minio:9000 "$ROOT_USER" "$ROOT_PASSWORD"; do
                echo "waiting for minio"
                sleep 3
              done
              mc mb --ignore-existing local/cleat-backups
              # Versioning first: it is what makes a restore possible after a
              # backup is overwritten by a bad one.
              mc version enable local/cleat-backups
              # Keep 35 days. Long enough to notice corruption that only shows
              # up at month end, short enough that the disk does not fill.
              mc ilm rule add --expire-days 35 local/cleat-backups || true
              echo "bucket ready"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
