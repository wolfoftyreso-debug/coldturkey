# Prometheus, Alertmanager and Grafana — self-hosted, like everything else.
#
# The point of this stack in this product is narrower than usual. It is not to
# make pretty dashboards; it is so that the craving screen failing at 2am is
# noticed before somebody's week goes past without the tool they were relying
# on. The alert rules below are chosen for that, not for completeness.
#
# PRIVACY: the API's /metrics endpoint carries no personal data — no user id,
# no tenant id, no free text, and route templates rather than resolved URLs.
# That is enforced by tests in the API, not by convention here. Nothing in this
# stack should ever be pointed at a source that has not made the same promise.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # The API's NetworkPolicy allows scraping from a namespace with exactly
    # this label. Renaming the namespace silently stops all metrics.
    kubernetes.io/metadata.name: monitoring
    app.kubernetes.io/part-of: cleat
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  # Read-only, and only what service discovery needs. Notably not secrets.
  - apiGroups: ['']
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: ['/metrics']
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      # The API. Scraped by annotation so a new deployment does not need a
      # config change to appear.
      - job_name: cleat-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [cleat]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          # Rewrite the scrape address to the annotated port. The address
          # arrives as "ip:someport"; the capture drops whatever port service
          # discovery guessed and substitutes the one the pod declared.
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # CloudNativePG exports replication lag and archiving status, which are
      # the two numbers that decide whether a restore is possible.
      - job_name: postgres
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [cleat, cleat-platform]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            target_label: cluster
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - action: replace
            target_label: __address__
            source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '$1:9187'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  cleat.yaml: |
    groups:
      - name: cleat-availability
        rules:
          # The one that matters most. Somebody opening the craving screen and
          # getting an error is the failure this product cannot have.
          - alert: ApiErrorRateHigh
            expr: |
              sum(rate(cleat_errors_total[5m]))
                / clamp_min(sum(rate(cleat_requests_total[5m])), 0.001) > 0.02
            for: 5m
            labels:
              severity: page
            annotations:
              summary: More than 2% of API requests are failing
              description: >-
                People open this product mid-craving. A sustained error rate
                means some of them are getting nothing.

          - alert: ApiDown
            expr: up{job="cleat-api"} == 0
            for: 2m
            labels:
              severity: page
            annotations:
              summary: An API pod has stopped reporting

          - alert: ApiLatencyHigh
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(cleat_http_request_duration_ms_bucket[5m])) by (le, route)
              ) > 2000
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 95th percentile latency above 2s on {{ $labels.route }}

      - name: cleat-data
        rules:
          # Continuous archiving failing means point-in-time recovery has
          # quietly stopped being possible. Nothing else reports this, and it
          # stays invisible until the restore that needed it.
          - alert: PostgresArchivingBroken
            expr: cnpg_pg_stat_archiver_failed_count > 0
            for: 15m
            labels:
              severity: page
            annotations:
              summary: WAL archiving is failing on {{ $labels.cluster }}
              description: Point-in-time recovery is not currently possible.

          - alert: PostgresReplicationLagging
            expr: cnpg_pg_replication_lag > 30
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Replication lag above 30s on {{ $labels.cluster }}

          - alert: NoRecentBackup
            expr: time() - cnpg_collector_last_available_backup_timestamp > 60 * 60 * 36
            for: 1h
            labels:
              severity: page
            annotations:
              summary: No successful base backup in 36 hours

      - name: cleat-product
        rules:
          # Not an error, but worth knowing about: if the model path is failing
          # every request, people are getting the local coach and nobody said so.
          - alert: CoachAlwaysFallingBack
            expr: |
              sum(rate(cleat_coach_local_total[15m]))
                / clamp_min(sum(rate(cleat_coach_local_total[15m]) + rate(cleat_coach_model_calls_total[15m])), 0.001) > 0.9
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: The coach is answering locally for almost every request

          - alert: MailDeliveryFailing
            expr: rate(cleat_mail_failed_total[15m]) > 0
            for: 15m
            labels:
              severity: page
            annotations:
              summary: The mail relay is refusing messages
              description: >-
                Password reset is currently broken, which means people are
                locked out of their own recovery history.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.2.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Metrics here are operational, not analytical. Ninety days is
            # plenty to investigate an incident and short enough that the
            # series do not become a dataset of their own.
            - --storage.tsdb.retention.time=90d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.28.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
          ports:
            - name: http
              containerPort: 9093
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: config
          secret:
            # A Secret rather than a ConfigMap because the receiver holds a
            # webhook URL or SMTP credentials.
            secretName: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.6.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            # No anonymous access and no sign-up. Dashboards built on this data
            # answer "how many people used the craving screen last night",
            # which is not a public question even in aggregate.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'false'
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: 'false'
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: 'false'
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
---
# Nothing in this namespace should be reachable from the internet, and nothing
# in it needs to reach the application except to scrape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cleat
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cleat-platform
    # The Kubernetes API, for service discovery.
    - ports:
        - port: 443
          protocol: TCP
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
