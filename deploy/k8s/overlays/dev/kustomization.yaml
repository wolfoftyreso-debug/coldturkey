apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cleat

resources:
  - ../../base

# One replica of everything and the bundled Postgres: enough to click through the
# whole product on a laptop cluster.
replicas:
  - name: cleat-api
    count: 1
  - name: cleat-web
    count: 1

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: cleat-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: ConfigMap
      name: cleat-config
    patch: |
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
      - op: replace
        path: /data/CORS_ORIGINS
        value: "*"
  # A single-replica dev cluster cannot satisfy a PDB during a node drain.
  - target:
      kind: PodDisruptionBudget
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 0
