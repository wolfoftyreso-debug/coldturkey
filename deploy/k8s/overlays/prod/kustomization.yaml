apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cleat

resources:
  - ../../base

replicas:
  - name: cleat-api
    count: 3
  - name: cleat-web
    count: 2

# Production runs PostgreSQL through CloudNativePG — three instances,
# synchronous replication, continuous WAL archiving and point-in-time
# recovery — from deploy/k8s/platform/postgres. The single-pod StatefulSet in
# base is for evaluation only and is deleted here.
#
# DATABASE_URL must be supplied in the `cleat-secrets` Secret, pointing at the
# operator's read-write service:
#
#   postgres://cleat:<password>@cleat-db-rw.cleat.svc.cluster.local:5432/cleat?sslmode=require
#
# It goes in the Secret rather than the ConfigMap because it carries the
# password, and `envFrom` lists the Secret after the ConfigMap so it wins.
patches:
  - patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: cleat-postgres
        namespace: cleat
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: cleat-postgres
        namespace: cleat
  - patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: postgres
        namespace: cleat
  - target:
      kind: ConfigMap
      name: cleat-config
    patch: |
      - op: replace
        path: /data/LOG_LEVEL
        value: info
      - op: replace
        path: /data/DATABASE_POOL_MAX
        value: "20"

# Secrets are never committed. Point this at an external secret store — the
# placeholder Secret in base/config.yaml exists only so `kustomize build`
# produces a complete manifest.
