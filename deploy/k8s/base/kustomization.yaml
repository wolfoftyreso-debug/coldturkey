apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cleat

# `labels` rather than the deprecated `commonLabels`, and deliberately without
# selector injection: a Deployment's selector is immutable once created, so
# folding these into it would make any future label change an un-appliable
# manifest.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: cleat
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
  - networkpolicy.yaml

images:
  - name: ghcr.io/wolfoftyreso-debug/cleat-api
    newTag: latest
  - name: ghcr.io/wolfoftyreso-debug/cleat-web
    newTag: latest
