apiVersion: v1
kind: Namespace
metadata:
  name: coldturkey
  labels:
    app.kubernetes.io/part-of: coldturkey
    # Enforce the restricted Pod Security Standard. Everything here runs
    # non-root with no privilege escalation; this makes that a rule rather than
    # a convention someone can quietly break in a later manifest.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
