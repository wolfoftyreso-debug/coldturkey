apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nivora
  namespace: nivora
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    # Recovery data must not leak through a referrer, and nothing here should
    # ever be framed by another site.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Referrer-Policy: no-referrer";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.nivora.example
        - api.nivora.example
      secretName: nivora-tls
  rules:
    - host: api.nivora.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nivora-api
                port:
                  number: 80
    # Organisation tenants are addressed by subdomain (clinic.nivora.example)
    # and resolved server-side. Note that after login the tenant always comes
    # from the signed token, so the hostname cannot be used to reach another
    # organisation's data.
    - host: app.nivora.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nivora-web
                port:
                  number: 80
