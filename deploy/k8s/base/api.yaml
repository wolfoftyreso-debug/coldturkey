# Schema migrations run as a Job before the rollout, not inside every pod.
#
# With more than one replica, N pods racing to migrate the same database is a
# real outage. The Job is idempotent (`schema_migrations` records what ran) and
# the API's boot-time migrate call becomes a no-op behind it.
apiVersion: batch/v1
kind: Job
metadata:
  name: coldturkey-migrate
  namespace: coldturkey
  annotations:
    argocd.argoproj.io/hook: PreSync
    helm.sh/hook: pre-install,pre-upgrade
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coldturkey-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/wolfoftyreso-debug/coldturkey-api:latest
          command: ['node', 'dist/db/migrate.js']
          envFrom:
            - configMapRef:
                name: coldturkey-config
            - secretRef:
                name: coldturkey-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: coldturkey-api
  namespace: coldturkey
  labels:
    app.kubernetes.io/name: coldturkey-api
spec:
  selector:
    app.kubernetes.io/name: coldturkey-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coldturkey-api
  namespace: coldturkey
  labels:
    app.kubernetes.io/name: coldturkey-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coldturkey-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coldturkey-api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: '/metrics'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so a single node failure never takes the
      # whole service down. Someone opening this app is often not in a position
      # to "try again later".
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: coldturkey-api
      containers:
        - name: api
          image: ghcr.io/wolfoftyreso-debug/coldturkey-api:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: coldturkey-config
            - secretRef:
                name: coldturkey-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          # Readiness touches the database: a pod that cannot reach Postgres is
          # pulled from the Service instead of serving 500s to someone mid-craving.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coldturkey-api
  namespace: coldturkey
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coldturkey-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coldturkey-api
  namespace: coldturkey
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coldturkey-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
