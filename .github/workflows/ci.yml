name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    # The API suite runs against a real PostgreSQL rather than a mock. The
    # tenant isolation this product depends on is enforced by row-level security
    # policies, and a mocked repository would happily "prove" an isolation the
    # database does not actually provide.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cleat
          POSTGRES_PASSWORD: cleat
          POSTGRES_DB: cleat
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cleat"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @cleat/core build
          pnpm --filter @cleat/i18n build

      # Lint before typecheck: it is faster, and the type-aware rules here find
      # a class the typechecker cannot. `no-floating-promises` alone caught
      # every mutation handler in the web app swallowing its own failures.
      - name: Lint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
        env:
          DATABASE_URL: postgres://cleat:cleat@localhost:5432/cleat
          JWT_SECRET: ci-secret-that-is-long-enough-for-hs256-signing
          NODE_ENV: test
          LOG_LEVEL: error
          # A throwaway key, so the at-rest encryption tests actually exercise
          # encryption. Without it they would pass by finding nothing, which is
          # the failure mode those tests exist to catch.
          FIELD_ENCRYPTION_KEYS: 'ci:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          FIELD_ENCRYPTION_ACTIVE_KEY: ci

      - name: Build API
        run: pnpm --filter @cleat/api build

      - name: Build web
        run: pnpm --filter @cleat/web build

      # Bundle the mobile app rather than only typechecking it. Metro resolves a
      # different module graph than tsc does — a missing runtime dependency is
      # invisible to the typechecker and fatal to the bundler — and a phone
      # client that cannot bundle is a client that cannot ship.
      - name: Bundle mobile
        run: pnpm --filter @cleat/mobile exec expo export --platform android --output-dir /tmp/expo-bundle

      # Security gate. A dependency advisory that reaches code we actually ship
      # blocks the deployment; one in build tooling does not, because failing
      # the pipeline on an Expo CLI transitive that never runs in production
      # trains people to pass --force. The distinction is the point, and it is
      # checked rather than asserted.
      - name: Dependency audit (serving path)
        run: |
          set -euo pipefail
          pnpm --filter @cleat/api list --prod --depth Infinity --json > /tmp/api-tree.json
          pnpm --filter @cleat/web list --prod --depth Infinity --json > /tmp/web-tree.json
          pnpm audit --json > /tmp/audit.json || true
          python3 - <<'PY'
          import json, sys
          audit = json.load(open('/tmp/audit.json'))
          advisories = audit.get('advisories', {}).values()
          blocking = []
          for a in advisories:
              if a['severity'] not in ('critical', 'high'):
                  continue
              for finding in a.get('findings', []):
                  for path in finding.get('paths', []):
                      # Anything reaching the API, or the web app other than
                      # through its build toolchain, is in the serving path.
                      if path.startswith('apps__api'):
                          blocking.append((a['severity'], a['module_name'], path))
          if blocking:
              print('Blocking advisories in the serving path:')
              for sev, mod, path in blocking:
                  print(f'  {sev} {mod} via {path}')
              sys.exit(1)
          print('No high or critical advisories in the serving path.')
          PY

      # A secret that ever reached a commit is compromised, so this scans the
      # whole history rather than the working tree.
      - name: Secret scan
        run: |
          set -euo pipefail
          if git grep -IEn "(api[_-]?key|secret|password|token)['\"]?[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9+/]{16,}" \
               $(git rev-list --all) -- '*.ts' '*.tsx' '*.js' '*.json' '*.yaml' '*.yml' \
             | grep -v "process.env" | grep -viE "example|placeholder|CHANGE|z\.string"; then
            echo "Possible committed secret above. Rotate it and rewrite history."
            exit 1
          fi
          echo "No committed secrets found."


  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing is a separate, deliberate step.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build overlays
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar xz
          ./kustomize build deploy/k8s/overlays/dev > /dev/null
          ./kustomize build deploy/k8s/overlays/prod > /dev/null

      # Validate the Prometheus config and alert rules, not just their
      # ConfigMap wrapper. A ConfigMap can be perfectly valid Kubernetes and
      # still hold a config Prometheus refuses to load — which is exactly what
      # the first version of that file did.
      - name: Validate Prometheus config and rules
        run: |
          python3 - <<'PY'
          import yaml
          docs = list(yaml.safe_load_all(open('deploy/k8s/platform/observability/observability.yaml')))
          for d in docs:
              if not d or d.get('kind') != 'ConfigMap':
                  continue
              if d['metadata']['name'] == 'prometheus-config':
                  open('/tmp/prom.yml', 'w').write(d['data']['prometheus.yml'])
              if d['metadata']['name'] == 'prometheus-rules':
                  open('/tmp/rules.yaml', 'w').write(d['data']['cleat.yaml'])
          PY
          docker run --rm -v /tmp/prom.yml:/prom.yml:ro -v /tmp/rules.yaml:/rules.yaml:ro \
            --entrypoint promtool prom/prometheus:v3.2.1 check config /prom.yml
          docker run --rm -v /tmp/rules.yaml:/rules.yaml:ro \
            --entrypoint promtool prom/prometheus:v3.2.1 check rules /rules.yaml

  # The stage that exists because everything above it can pass while the app is
  # completely unusable.
  #
  # Two of the worst defects this codebase has shipped were invisible to every
  # other job here: a Content-Security-Policy that blocked every API call in the
  # deployed configuration, and a two-factor feature with no interface that
  # would have locked out anyone who enabled it. Both were found by driving a
  # browser. Neither could have been found any other way, because in both cases
  # each layer was individually correct and the defect lived in the gap between
  # them.
  #
  # This runs the app in the shape production runs it: one origin, /v1 proxied
  # to the API, the same image configuration, a real database.
  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cleat
          POSTGRES_PASSWORD: cleat
          POSTGRES_DB: cleat
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cleat"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @cleat/web exec playwright install --with-deps chromium

      - name: Run the suite
        run: bash scripts/e2e.sh
        env:
          DATABASE_URL: postgres://cleat:cleat@localhost:5432/cleat
          JWT_SECRET: ci-secret-that-is-long-enough-for-hs256-signing
          FIELD_ENCRYPTION_KEYS: 'ci:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          FIELD_ENCRYPTION_ACTIVE_KEY: ci
          LOG_LEVEL: error
          CI: 'true'

      # Traces and screenshots from a failed run. Without them a red E2E job is
      # a mystery, and a mystery that takes an afternoon gets disabled.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: apps/web/test-results/
          retention-days: 7
