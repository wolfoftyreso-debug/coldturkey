name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    # The API suite runs against a real PostgreSQL rather than a mock. The
    # tenant isolation this product depends on is enforced by row-level security
    # policies, and a mocked repository would happily "prove" an isolation the
    # database does not actually provide.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cleat
          POSTGRES_PASSWORD: cleat
          POSTGRES_DB: cleat
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cleat"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @cleat/core build
          pnpm --filter @cleat/i18n build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
        env:
          DATABASE_URL: postgres://cleat:cleat@localhost:5432/cleat
          JWT_SECRET: ci-secret-that-is-long-enough-for-hs256-signing
          NODE_ENV: test
          LOG_LEVEL: error

      - name: Build API
        run: pnpm --filter @cleat/api build

      - name: Build web
        run: pnpm --filter @cleat/web build

      # Bundle the mobile app rather than only typechecking it. Metro resolves a
      # different module graph than tsc does — a missing runtime dependency is
      # invisible to the typechecker and fatal to the bundler — and a phone
      # client that cannot bundle is a client that cannot ship.
      - name: Bundle mobile
        run: pnpm --filter @cleat/mobile exec expo export --platform android --output-dir /tmp/expo-bundle

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing is a separate, deliberate step.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build overlays
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar xz
          ./kustomize build deploy/k8s/overlays/dev > /dev/null
          ./kustomize build deploy/k8s/overlays/prod > /dev/null
