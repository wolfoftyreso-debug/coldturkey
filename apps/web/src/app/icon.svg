<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The Cleat mark: a horn cleat — the fitting you lay a line around so it holds.
    Not strength, grip. The line is not tied and not knotted; it holds because of
    the shape it is laid against, and it comes free the moment you want it to.

    Abstract enough that a non-sailor just sees a mark. Nothing here tells a
    bystander glancing at the tab what the person is dealing with.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0b0d"/>
  <g fill="none" stroke="#dda05a" stroke-width="2.6" stroke-linecap="round">
    <!-- The bar, and the two horns turning up at its ends. -->
    <path d="M6 13 H26" />
    <path d="M6 13 L2.5 8.5" />
    <path d="M26 13 L29.5 8.5" />
    <!-- The base it stands on. -->
    <path d="M16 13 V25" />
  </g>
</svg>
