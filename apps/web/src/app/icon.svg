<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The Nivora mark: an arc opened at the top, with the terminal rising past the
    circle it came from. The cycle broken, moving up.

    Abstract on purpose. No bottles, no pills, no chains, no silhouettes at
    windows — nothing that tells a bystander glancing at the tab what the person
    is dealing with. It has to read as a company at 16px, not as a support group.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0b0d"/>
  <g fill="none" stroke="#dda05a" stroke-width="3" stroke-linecap="round">
    <!-- The open cycle: sweeps from the top gap clockwise round to the right. -->
    <path d="M13.4 7.1a9.2 9.2 0 1 0 11.4 11.6"/>
    <!-- The terminal, rising clear of it. -->
    <path d="M19.6 12.4 L25.4 6.6"/>
  </g>
</svg>
